const playBeep=()=>{
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [[0,880],[0.18,880],[0.36,1200]].forEach(([t,freq])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=freq;
      g.gain.setValueAtTime(0.35,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.18);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.2);
    });
  }catch(e){}
};

// ── REST BAR ──────────────────────────────────────────────────────────
function RestBar({seconds,active,onStart,onSkip,onToggle}){
  const urgentColor=seconds<=10?C.red:seconds<=30?C.amber:C.teal;
  if(!active&&seconds===0) return null;
  return(
    <div style={{position:"fixed",bottom:60,left:0,right:0,background:C.navy,
      padding:"10px 16px",display:"flex",alignItems:"center",gap:12,
      boxShadow:"0 -2px 10px rgba(0,0,0,0.35)",zIndex:99}}>
      <div style={{flex:1}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
          <span style={{fontSize:10,color:C.tealLight,fontWeight:"bold",letterSpacing:1}}>REST TIMER</span>
          <span style={{fontSize:22,fontWeight:"bold",color:urgentColor,fontVariantNumeric:"tabular-nums",lineHeight:1}}>{fmt(seconds)}</span>
        </div>
        <div style={{background:C.navy2,borderRadius:4,height:5}}>
          <div style={{background:urgentColor,width:`${Math.min((seconds/180)*100,100)}%`,
            height:5,borderRadius:4,transition:"width 1s linear"}}/>
        </div>
      </div>
      <button onClick={onToggle} style={btn(active?C.amber:C.green,C.white,true)}>{active?"Pause":"Go"}</button>
      <button onClick={onSkip} style={btn(C.gray,C.white,true)}>Skip</button>
    </div>
  );
}

// ── SET ROW ────────────────────────────────────────────────────────────
function SetRow({dayIdx,secIdx,exIdx,setNum,defaultReps,restSeconds,onStartRest}){
  const k=setKey(dayIdx,secIdx,exIdx,setNum);
  const saved=LS.get(k,{weight:"",reps:"",done:false});
  const[weight,setWeight]=useState(saved.weight);
  const[reps,setReps]=useState(saved.reps||defaultReps);
  const[done,setDone]=useState(saved.done);
  const save=(w,r,d)=>LS.set(k,{weight:w,reps:r,done:d});
  const toggleDone=()=>{
    const nd=!done;setDone(nd);save(weight,reps,nd);
    if(nd){
      const hist=LS.get(histKey(),[]);
      hist.push({date:today(),day:PLAN[dayIdx].day,
        exercise:PLAN[dayIdx].sections[secIdx].exercises[exIdx].name,
        set:setNum,weight,reps});
      LS.set(histKey(),hist.slice(-500));
      if(restSeconds>0)onStartRest(restSeconds);
    }
  };
  return(

      <span style={{fontSize:11,color:C.gray}}>×</span>

// ── EXERCISE CARD ──────────────────────────────────────────────────────
function ExCard({ex,dayIdx,secIdx,exIdx,onStartRest}){
  const[open,setOpen]=useState(false);
  const[showSwaps,setShowSwaps]=useState(false);
  const sets=Array.from({length:ex.sets},(_,i)=>i+1);
  const allDone=sets.every(s=>(LS.get(setKey(dayIdx,secIdx,exIdx,s),{done:false})).done);
  const hasSwaps=ex.swaps&&ex.swaps.length>0;
  return(
    <div style={{marginBottom:8,borderRadius:8,overflow:"hidden",
      boxShadow:"0 1px 4px rgba(0,0,0,0.07)",
      border:`1px solid ${allDone?C.green:C.grayBorder}`}}>
      <div onClick={()=>setOpen(!open)} style={{padding:"10px 14px",cursor:"pointer",
        background:allDone?C.greenLight:C.white,
        display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:"bold",fontSize:13,color:allDone?C.green:C.navy}}>{ex.name}</div>
          <div style={{fontSize:11,color:C.teal2,marginTop:2}}>
            {ex.sets} × {ex.reps}
            {ex.tempo?` | ${ex.tempo}`:""}
            {ex.rest>0?` | Rest ${fmt(ex.rest)}`:""}
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
          {allDone&&<span style={{fontSize:11,fontWeight:"bold",color:C.green}}>✓</span>}
          {hasSwaps&&(
            <button onClick={e=>{e.stopPropagation();setShowSwaps(!showSwaps);}}
              style={btn(showSwaps?C.teal:C.navy2,C.white,true,false,{fontSize:10,padding:"3px 8px"})}>
              {showSwaps?"×":"Swap"}
            </button>
          )}
          <span style={{color:C.gray,fontSize:16,marginLeft:2}}>{open?"▲":"▼"}</span>
        </div>
      </div>
      {showSwaps&&(
        <div style={{background:C.amberLight,borderTop:`1px solid ${C.amber}33`,padding:"8px 14px"}}>
          <div style={{fontSize:10,color:C.amber,fontWeight:"bold",marginBottom:6,letterSpacing:0.5}}>EXERCISE SWAPS</div>
          {ex.swaps.map((s,i)=>(
            <div key={i} style={{fontSize:11,color:C.navy,padding:"5px 0",
              borderBottom:i<ex.swaps.length-1?`1px solid ${C.amber}22`:"none",lineHeight:1.4}}>
              → {s}
            </div>
          ))}
        </div>
      )}
      {open&&(
        <div style={{padding:"10px 14px",background:C.grayLight,borderTop:`1px solid ${C.grayBorder}`}}>
          <div style={{fontSize:11,color:C.gray,fontStyle:"italic",marginBottom:10,
            lineHeight:1.5,whiteSpace:"pre-line"}}>{ex.cue}</div>
          {sets.map(s=>(
            <SetRow key={s} dayIdx={dayIdx} secIdx={secIdx} exIdx={exIdx}
              setNum={s} defaultReps={ex.reps} restSeconds={ex.rest||0} onStartRest={onStartRest}/>
          ))}
        </div>
      )}
    </div>
  );
}

// ── DAY VIEW ───────────────────────────────────────────────────────────
function DayView({dayIdx,onStartRest}){
  const day=PLAN[dayIdx];
  const[note,setNote]=useState(()=>LS.get(noteKey(dayIdx),""));
  const[showNote,setShowNote]=useState(false);
  const saveNote=v=>{setNote(v);LS.set(noteKey(dayIdx),v);};
  const totalEx=day.sections.reduce((a,s)=>a+s.exercises.length,0);
  const doneEx=day.sections.reduce((a,sec)=>a+sec.exercises.reduce((b,ex,ei)=>{
    const si=day.sections.indexOf(sec);
    return b+(Array.from({length:ex.sets},(_,i)=>i+1).every(
      s2=>(LS.get(setKey(dayIdx,si,ei,s2),{done:false})).done)?1:0);
  },0),0);
  const pct=Math.round((doneEx/totalEx)*100);
  const carbColor=day.carbTier==="HIGH"?C.green:day.carbTier==="MODERATE"?C.amber:C.red;
  return(

          <div style={{background:pct===100?C.green:C.teal,width:`${pct}%`,height:10,borderRadius:6,transition:"width 0.3s"}}/>

  const byDate={};
  hist.forEach(h=>{if(!byDate[h.date])byDate[h.date]=[];byDate[h.date].push(h);});

  if(hist.length===0) return(
    <div style={{textAlign:"center",color:C.gray,padding:40,fontStyle:"italic"}}>
      No history yet. Check off sets during your sessions to build your log.

// ── APP ────────────────────────────────────────────────────────────────
function App(){
  const[view,setView]=useState("overview");
  const[dayIdx,setDayIdx]=useState(null);
  const[restSec,setRestSec]=useState(0);
  const[restActive,setRestActive]=useState(false);
  const timerRef=useRef(null);

  useEffect(()=>{
    if(restActive&&restSec>0){
      timerRef.current=setTimeout(()=>setRestSec(s=>s-1),1000);
    } else if(restActive&&restSec===0){
      playBeep();
      setRestActive(false);
    }
    return()=>clearTimeout(timerRef.current);
  },[restActive,restSec]);

  const startRest=s=>{clearTimeout(timerRef.current);setRestSec(s);setRestActive(true);};
  const skipRest=()=>{clearTimeout(timerRef.current);setRestSec(0);setRestActive(false);};
  const toggleRest=()=>setRestActive(a=>!a);
  const selectDay=i=>{setDayIdx(i);setView("day");};
  const currentDay=PLAN[dayIdx]??null;
  const timerRunning=restActive||restSec>0;

  return(
    <div style={{minHeight:"100vh",background:C.cream,fontFamily:"Georgia,serif"}}>
      <div style={{background:C.navy,padding:"14px 18px",position:"sticky",top:0,zIndex:100,
        boxShadow:"0 2px 12px rgba(0,0,0,0.25)"}}>
        <div style={{color:C.white,fontWeight:"bold",fontSize:17}}>Anthony Anderson</div>
        <div style={{color:C.tealLight,fontSize:11,marginTop:1}}>
          {view==="day"&&currentDay?`${currentDay.day} — ${currentDay.label}`:"Hybrid Warrior System"}
        </div>
      </div>

      {view==="day"&&(
        <div style={{background:C.navy2,overflowX:"auto",display:"flex",gap:6,
          padding:"8px 12px",WebkitOverflowScrolling:"touch"}}>
          {PLAN.map((d,i)=>(
            <button key={i} onClick={()=>setDayIdx(i)}
              style={btn(i===dayIdx?C.teal:C.navy,C.white,true,false,{
                flexShrink:0,whiteSpace:"nowrap",
                border:`1px solid ${i===dayIdx?C.teal:C.grayBorder+"66"}`})}>
              {d.day.slice(0,3)}
            </button>
          ))}
        </div>
      )}

      <div style={{padding:12}}>
        {view==="overview"&&<OverviewView onSelectDay={selectDay}/>}
        {view==="day"&&dayIdx!==null&&<DayView key={`${dayIdx}-${today()}`} dayIdx={dayIdx} onStartRest={startRest}/>}
        {view==="nutrition"&&<NutritionView/>}
        {view==="history"&&<HistoryView/>}
      </div>

      {timerRunning
        ?<RestBar seconds={restSec} active={restActive} onStart={startRest} onSkip={skipRest} onToggle={toggleRest}/>
        :view==="day"&&<RestPresets onStart={startRest}/>
      }

      <div style={{position:"fixed",bottom:0,left:0,right:0,background:C.white,
        borderTop:`1px solid ${C.grayBorder}`,display:"flex",zIndex:100}}>
        {[
          {id:"overview",label:"📋 Schedule"},
          {id:"day",label:"🏋️ Session"},
          {id:"nutrition",label:"🥗 Nutrition"},
          {id:"history",label:"📈 History"},
        ].map(t=>(
          <button key={t.id} onClick={()=>{
            setView(t.id);
            if(t.id==="day"&&dayIdx===null)setDayIdx(0);
          }} style={{flex:1,padding:"12px 0",border:"none",
            borderTop:`3px solid ${view===t.id?C.teal:"transparent"}`,
            background:C.white,fontFamily:"Georgia,serif",fontSize:10,
            fontWeight:view===t.id?"bold":"normal",
            color:view===t.id?C.teal:C.gray,cursor:"pointer"}}>
            {t.label}
          </button>
        ))}
      </div>
      <div style={{height:60}}/>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
