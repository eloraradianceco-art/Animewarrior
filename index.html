<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="color-scheme" content="dark light"/>
<meta name="theme-color" content="#080A0D" media="(prefers-color-scheme: dark)"/>
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Hybrid Warrior"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="description" content="Hybrid Warrior System — training tracker, rest timer, exercise swaps and nutrition plan."/>
<title>Hybrid Warrior — Anthony Anderson</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ── THEME ─────────────────────────────────────────────── */
:root{
  --bg:#080A0D; --surface:#11151A; --surface2:#171C23; --line:#222A33; --line2:#313B47;
  --text:#F2F4F7; --muted:#A3AEBA; --faint:#6F7A87;
  --accent:#FF6A2B; --accent2:#FFA24A; --accent-ink:#1A0A02;
  --good:#3DD68C; --warn:#F5B93A; --cool:#5BA8FF; --ok-ink:#04130A;
  --c-navy:#7C93FF; --c-navy2:#B794F6; --c-teal:#38BDF8; --c-teal2:#2DD4BF;
  --c-amber:#F5B93A; --c-green:#3DD68C; --c-red:#FF6B6B; --c-gray:#A3AEBA;
  --hl:rgba(255,255,255,.055); --shadow:0 14px 30px -16px rgba(0,0,0,.75); --glow:rgba(255,106,43,.22);
  --nav-h:72px; --nav-gap:16px; --dock-h:70px; --rail:min(calc(100% - 24px),520px);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#F4F1EA; --surface:#FFFFFF; --surface2:#F7F4EE; --line:#E6E1D5; --line2:#D2CCBC;
    --text:#14181D; --muted:#505A65; --faint:#85909B;
    --accent:#E24A12; --accent2:#F28A2E; --accent-ink:#FFFFFF;
    --good:#12804A; --warn:#9A5F04; --cool:#1F6FD1; --ok-ink:#FFFFFF;
    --c-navy:#4A5FD6; --c-navy2:#7A55D1; --c-teal:#0A86B8; --c-teal2:#0E8F83;
    --c-amber:#9A5F04; --c-green:#12804A; --c-red:#C93434; --c-gray:#505A65;
    --hl:rgba(255,255,255,.9); --shadow:0 14px 28px -18px rgba(40,30,10,.35); --glow:rgba(226,74,18,.16);
  }
}

/* ── BASE ──────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{background:radial-gradient(120% 60% at 50% -10%,var(--glow),transparent 62%) no-repeat,var(--bg);background-attachment:fixed;
  color:var(--text);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
input,textarea{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.boot{display:grid;place-items:center;min-height:100vh;font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

/* ── TOP BAR ───────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 96%,transparent),color-mix(in srgb,var(--bg) 82%,transparent));
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 14px) 18px 14px}
.top-in{max-width:720px;margin:0 auto}
.eyebrow{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
.eyebrow::before{content:"";width:18px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.title{font-family:var(--display);font-weight:700;font-size:31px;line-height:1;letter-spacing:.02em;text-transform:uppercase;margin-top:7px}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;letter-spacing:.01em}
.pills{display:flex;gap:7px;overflow-x:auto;padding-top:14px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{position:relative;flex:1 0 auto;min-width:52px;height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);
  font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);transition:background .2s,color .2s}
.pill[aria-current="true"]{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-ink);box-shadow:0 8px 18px -8px var(--accent)}
.pill.today::after{content:"";position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.pill.today[aria-current="true"]::after{background:var(--accent-ink)}

/* ── LAYOUT ────────────────────────────────────────────── */
.main{max-width:720px;margin:0 auto;padding:18px 16px calc(var(--nav-h) + var(--nav-gap) + env(safe-area-inset-bottom) + 40px)}
.main.has-dock{padding-bottom:calc(var(--nav-h) + var(--nav-gap) + var(--dock-h) + env(safe-area-inset-bottom) + 52px)}
.card{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 94%,var(--bg)));border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;
  box-shadow:inset 0 1px 0 var(--hl),var(--shadow)}
.h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.h3{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase}
.label{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;white-space:nowrap;
  font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tone);background:color-mix(in srgb,var(--tone) 13%,transparent);border:1px solid color-mix(in srgb,var(--tone) 38%,transparent)}
.btn{height:46px;padding:0 20px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);
  font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 10px 20px -10px var(--accent)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2);box-shadow:none}
.btn.sm{height:38px;padding:0 15px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:56px 24px;font-style:italic}

/* ── SCHEDULE ──────────────────────────────────────────── */
.row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line);min-height:72px;color:var(--text)}
.row:last-child{border-bottom:0;padding-bottom:2px}
.rail{flex:0 0 4px;align-self:stretch;border-radius:2px;background:var(--tone);box-shadow:0 0 12px -2px var(--tone)}
.row-main{flex:1;min-width:0}
.row-day{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:23px;line-height:1;letter-spacing:.05em;text-transform:uppercase}
.row-lab{color:var(--muted);font-size:13.5px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto;max-width:132px}
.kcal{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;line-height:1.25}
.today-tag{display:inline-block;vertical-align:1px;margin-right:7px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:999px;padding:0 8px;line-height:17px}
.princ{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.princ:last-child{border-bottom:0;padding-bottom:0}
.princ .k{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--tone)}
.princ .v{color:var(--muted);font-size:14px;line-height:1.45}
.prog-card .princ{grid-template-columns:136px 1fr}
.princ .k{overflow-wrap:anywhere}
.prog-card{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 11%,var(--surface)),var(--surface) 70%)}

/* ── SESSION ───────────────────────────────────────────── */
.hero-prog{display:flex;align-items:center;gap:18px;border-color:color-mix(in srgb,var(--accent) 30%,var(--line));
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 9%,var(--surface)),var(--surface) 65%)}
.ring{position:relative;flex:0 0 78px;width:78px;height:78px}
.ring svg{width:78px;height:78px;transform:rotate(-90deg)}
.ring .trk{stroke:var(--line2);opacity:.6}
.ring .bar{stroke:url(#rg);transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.ring.full .bar{stroke:var(--good)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.hp-text{display:flex;flex-direction:column;gap:5px;min-width:0}
.prog-n{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.complete{font-family:var(--display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--good);font-size:14px}
.tiles{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-bottom:14px}
.tile{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 94%,var(--bg)));border:1px solid var(--line);border-radius:18px;padding:15px 16px;
  display:flex;flex-direction:column;gap:9px;align-items:flex-start;box-shadow:inset 0 1px 0 var(--hl),var(--shadow)}
.big{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.banner{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--c-teal2) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c-teal2) 40%,var(--line));
  color:var(--c-teal2);border-radius:16px;padding:12px 15px;margin-bottom:14px;font-weight:600;font-size:13px}
.sec-h{display:flex;align-items:center;gap:11px;margin:28px 2px 12px}
.sec-h .bar{width:4px;height:18px;border-radius:2px;background:var(--tone);box-shadow:0 0 12px -1px var(--tone)}
.sec-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.ex{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 94%,var(--bg)));border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden;
  box-shadow:inset 0 1px 0 var(--hl),var(--shadow)}
.ex.done{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.ex-head{display:flex;align-items:stretch}
.ex-toggle{flex:1;min-width:0;display:flex;align-items:center;gap:13px;text-align:left;padding:15px;min-height:72px}
.ex-idx{flex:0 0 32px;height:32px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);display:grid;place-items:center;
  font-family:var(--display);font-weight:700;font-size:16px}
.ex.done .ex-idx{background:var(--good);border-color:var(--good);color:var(--ok-ink)}
.ex-text{flex:1;min-width:0;display:flex;flex-direction:column}
.ex-name{font-weight:600;font-size:16.5px;line-height:1.2;letter-spacing:.005em}
.ex.done .ex-name{color:var(--good)}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.meta{font-size:12px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-variant-numeric:tabular-nums}
.chev{display:inline-grid;color:var(--faint);transition:transform .2s}
.chev.open{transform:rotate(180deg)}
.swap{flex:0 0 auto;align-self:center;margin-right:12px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);
  font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.swap.on{background:var(--warn);border-color:var(--warn);color:#160F00}
.swaps{padding:13px 15px 15px;background:color-mix(in srgb,var(--warn) 9%,var(--surface));border-top:1px solid color-mix(in srgb,var(--warn) 35%,var(--line))}
.swaps .label{color:var(--warn);display:block;margin-bottom:8px}
.swap-row{padding:10px 0;border-bottom:1px solid color-mix(in srgb,var(--warn) 22%,var(--line));font-size:14px;line-height:1.4}
.swap-row:last-child{border-bottom:0;padding-bottom:0}
.swap-row b{font-weight:600}
.swap-row span{color:var(--muted)}
.swapped{display:block;margin-top:4px;font-size:12px;font-weight:600;color:var(--warn);letter-spacing:.02em}
.swap.used{background:color-mix(in srgb,var(--warn) 16%,transparent);border-color:color-mix(in srgb,var(--warn) 55%,var(--line2));color:var(--warn)}
.swap-row.opt{display:block;position:relative;width:100%;text-align:left;color:var(--text);padding:12px 82px 12px 12px;margin-top:6px;min-height:48px;
  border:1px solid color-mix(in srgb,var(--warn) 30%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--surface) 70%,transparent);border-bottom:1px solid color-mix(in srgb,var(--warn) 30%,var(--line))}
.swap-row.opt:last-child{padding-bottom:12px}
.swap-row.opt i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--warn)}
.swap-row.opt.sel{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.swap-note{margin-bottom:8px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--warn) 10%,transparent);border:1px solid color-mix(in srgb,var(--warn) 30%,var(--line));color:var(--text)}
.swap-note b{color:var(--warn)}
.ex-body{padding:4px 15px 15px;border-top:1px solid var(--line);background:var(--surface2)}
.cue{color:var(--muted);font-size:14px;line-height:1.55;padding:13px 0 15px;white-space:pre-line}
.set{display:grid;grid-template-columns:50px 1fr 1fr 50px;gap:9px;align-items:center;margin-bottom:9px}
.set-n{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.fw{position:relative;display:block}
.field{width:100%;height:50px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);
  text-align:center;font-size:17px;font-weight:600;padding:0 36px 0 10px;font-variant-numeric:tabular-nums}
.field::placeholder{color:var(--faint);font-weight:400}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.fw em{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;font-style:normal;font-size:11px;color:var(--faint);
  font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.check{width:50px;height:50px;border-radius:14px;border:2px solid var(--line2);display:grid;place-items:center;color:transparent;background:var(--surface)}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--ok-ink);box-shadow:0 8px 18px -8px var(--good)}
.set.done .field{border-color:color-mix(in srgb,var(--good) 55%,var(--line2))}
.textarea{width:100%;min-height:100px;resize:vertical;border-radius:14px;background:var(--surface2);border:1px solid var(--line2);padding:13px;font-size:16px;line-height:1.45}
.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.note-prev{color:var(--muted);font-style:italic;line-height:1.5}

/* ── NUTRITION ─────────────────────────────────────────── */
.hero{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 17%,var(--surface)),var(--surface) 72%);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));
  border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:inset 0 1px 0 var(--hl),var(--shadow)}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}
.macro{text-align:center;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--line);border-radius:14px;padding:11px 4px}
.macro b{display:block;font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--tone,var(--text))}
.macro span{font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.cyc{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.cyc:last-child{border-bottom:0;padding-bottom:0}
.cyc .d{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.cyc .d.now{color:var(--accent)}
.cyc .r{display:flex;align-items:center;gap:8px}
.cyc .kcal{white-space:nowrap}
.meal{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 94%,var(--bg)));border:1px solid var(--line);border-radius:20px;margin-bottom:12px;overflow:hidden;
  border-left:4px solid var(--tone);box-shadow:inset 0 1px 0 var(--hl),var(--shadow)}
.meal-head{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;color:var(--text)}
.meal-t{flex:1;min-width:0}
.meal-n{font-weight:600;font-size:16.5px;line-height:1.2}
.meal-s{color:var(--muted);font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.meal-m{font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.meal-body{padding:2px 16px 16px;border-top:1px solid var(--line);background:var(--surface2)}
.meal-sec{margin-top:15px}
.meal-sec .label{color:var(--tone);display:block;margin-bottom:7px}
.food{padding:6px 0 6px 13px;border-left:2px solid color-mix(in srgb,var(--tone) 45%,transparent);margin-bottom:3px;font-size:14.5px}
.list-h{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin:12px 0 7px}
.list-h:first-of-type{margin-top:0}
.li{padding:6px 0 6px 13px;border-left:2px solid color-mix(in srgb,var(--tone) 45%,transparent);margin-bottom:3px;font-size:14.5px}

/* ── HISTORY ───────────────────────────────────────────── */
.hday{padding:0;overflow:hidden}
.hday-h{padding:11px 18px;background:var(--surface2);border-bottom:1px solid var(--line);font-family:var(--display);font-weight:700;letter-spacing:.16em;font-size:14px}
.hrow{display:flex;justify-content:space-between;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);font-size:14px}
.hrow:last-child{border-bottom:0}
.hrow b{font-weight:600;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ── REST DOCK (floating, sits above nav) ─────────────── */
.dock{position:fixed;left:50%;transform:translateX(-50%);width:var(--rail);z-index:60;height:var(--dock-h);
  bottom:calc(var(--nav-h) + var(--nav-gap) + env(safe-area-inset-bottom) + 10px);
  background:color-mix(in srgb,var(--surface2) 90%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--line2);border-radius:22px;padding:0 12px;display:flex;align-items:center;overflow:hidden;
  box-shadow:inset 0 1px 0 var(--hl),0 18px 34px -14px rgba(0,0,0,.65)}
.dock-in{width:100%;display:flex;align-items:center;gap:8px}
.dock .pre{flex:1;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);
  font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.dock .pre:active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border-color:transparent}
.dock .label{flex:0 0 auto;margin-right:2px}
.t-bar{position:absolute;left:0;right:0;top:0;height:3px;background:var(--line)}

/* ── NAV (floating glass bar) ──────────────────────────── */
.nav{position:fixed;left:50%;transform:translateX(-50%);width:var(--rail);bottom:calc(var(--nav-gap) + env(safe-area-inset-bottom));z-index:70;
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;height:var(--nav-h);
  background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid var(--line2);border-radius:26px;box-shadow:inset 0 1px 0 var(--hl),0 22px 40px -14px rgba(0,0,0,.7)}
.nav button{position:relative;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--muted);
  font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;transition:background .2s,color .2s;padding:0 2px}

@media (min-width:640px){
  .main{padding-top:24px}
  .title{font-size:38px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── v5 additions ──────────────────────────────────────── */
.small{font-size:12.5px}

.stat b{display:block;font-family:var(--display);font-weight:700;font-size:23px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);
  font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;min-height:64px}
.wd i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;color:var(--ok-ink)}
.wd i svg{width:16px;height:16px}
.wd.part i{border-color:var(--accent);background:conic-gradient(var(--accent) 0 50%,transparent 50%)}
.wd.full i{background:var(--good);border-color:var(--good)}
.wd.now{border-color:var(--accent);color:var(--accent)}
.note-b{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:13.5px;line-height:1.45;display:flex;flex-direction:column;gap:10px;

.note-b b{color:var(--warn)}
.deload-b{margin-bottom:14px}

.ci-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ci-grid .full{grid-column:1/-1}
.ci-l{display:block;margin-bottom:6px}
.rates{display:flex;gap:6px}
.rate{flex:1;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted)}
.rate[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-ink)}
.field.plain{padding:0 12px;text-align:left}

.ex-info{margin:2px 0 12px;display:flex;flex-direction:column;gap:6px}
.info-row{display:flex;gap:10px;align-items:baseline;font-size:13.5px;font-variant-numeric:tabular-nums}
.info-row .label{flex:0 0 96px;font-size:11.5px;white-space:nowrap}
.info-row.up{color:var(--good);font-weight:600}
.info-row.up .label{color:var(--good)}
.ex-actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.sec-h .clockbtn{margin-left:auto;order:3;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);display:inline-flex;align-items:center;gap:6px;

.sec-h .clockbtn svg{width:15px;height:15px}
.sec-h{flex-wrap:nowrap}
.sec-h::after{order:2}
.sec-h .clockbtn{margin-left:0}
.csum{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.pro-bar{position:relative;height:12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);margin:12px 0 6px;overflow:hidden}
.pro-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--c-teal),var(--c-teal2));transition:width .3s}
.pro-bar.ok i{background:linear-gradient(90deg,var(--good),var(--c-teal2))}
.pro-bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.qa{height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.qa:active{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.add-row{display:flex;gap:8px;margin-top:12px}

.bk-msg{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.4}

.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.spark{width:100%;height:56px;margin-top:10px}
.spark path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark circle{fill:var(--accent)}
.ci-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.ci-row:last-child{border-bottom:0;padding-bottom:0}
.ci-row span:first-child{font-family:var(--display);font-weight:700;letter-spacing:.1em}

/* ── Interval clock overlay ───────────────────────────── */
.clock{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% -10%,var(--glow),transparent 62%) no-repeat,var(--bg);
  padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px)}
.clock.work{--ph:var(--good)}
.clock.rest{--ph:var(--cool)}
.clock-top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;width:100%;margin:0 auto}
.clock-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;max-width:560px;width:100%;margin:0 auto;min-height:0}
.clock-badge{display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ph,var(--accent));background:color-mix(in srgb,var(--ph,var(--accent)) 14%,transparent);border:1px solid color-mix(in srgb,var(--ph,var(--accent)) 45%,transparent)}
.clock-step{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.02;letter-spacing:.03em;text-transform:uppercase}
.clock-target{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.clock-time{font-family:var(--display);font-weight:700;font-size:min(34vw,168px);line-height:.95;font-variant-numeric:tabular-nums;color:var(--ph,var(--text))}
.clock-time.sm{font-size:min(24vw,120px)}
.clock-next{color:var(--muted);font-size:14.5px}
.clock-next b{color:var(--text);font-weight:600}
.clock-bar{width:100%;height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.clock-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s linear}
.clock-actions{display:flex;gap:10px;max-width:560px;width:100%;margin:0 auto;flex-wrap:wrap}
.clock-actions .btn{flex:1;min-width:110px;height:56px;font-size:17px}
.clock-opts{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;color:var(--muted);font-size:13.5px}
.tog{width:46px;height:28px;border-radius:999px;background:var(--line2);position:relative;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tog[aria-pressed="true"]{background:var(--good)}
.tog[aria-pressed="true"]::after{transform:translateX(18px)}
.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.splits{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;max-height:112px;overflow:auto;width:100%}
.stations{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.stations span{font-size:12.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.mark-row{display:flex;flex-direction:column;gap:8px;width:100%}
</style>
